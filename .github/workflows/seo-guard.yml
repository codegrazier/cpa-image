name: SEO Guard
on: [push, pull_request]
jobs:
  build-and-assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20.19.0' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Assert SEO invariants
        run: node scripts/assert-seo.mjs
